[project]
name = "service"
authors = [{ name = "Sascha Fleer", email = "sascha.fleer@gmail.com" }]
maintainers = [{ name = "Sascha Fleer", email = "sascha.fleer@gmail.com" }]
##################
# Version Information
#
# This module provides the code version and is
# automatically updated by the python-semantic-release package.
#
# DO NOT EDIT IT MANUALLY.
##################
version = "1.1.5"
description = "Service for receiving and processing measurements from the Cistern IoT device."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "alembic>=1.14.1",
  "fastapi[standard]>=0.115.7",
  "httpx>=0.28.1",
  "pandas>=2.2.3",
  "psycopg>=3.2.4",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.37",
  "sqlalchemy-utils>=0.41.2",
  "toml>=0.10.2",
]

[dependency-groups]
docs = [
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-literate-nav>=0.6.1",
  "mkdocs-material>=9.5.50",
  "mkdocs-section-index>=0.3.9",
  "mkdocstrings>=0.27.0",
]
dev = [
  "ipython>=8.31.0",
  "mypy>=1.18.2",
  "pandas-stubs>=2.2.3.250308",
  "pytest>=8.3.4",
  "pytest-alembic>=0.11.1",
  "pytest-cov>=6.0.0",
  "types-toml>=0.10.8.20240310",
]

[project.urls]
Source = "https://github.com/fleer/cistern_monitor"

[project.scripts]
service_start = 'service.api:start'

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["logging_config/*.ini"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".parquet",
  ".feather",
  ".env",
  ".log",
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F", "D", "PL", "I", "N", "G", "TCH", "ANN", "C901", "S"]
ignore = ["D211", "D213", "D406", "E226", "E241", "E242"]


# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
  "S101",    # asserts allowed in tests...
  "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
  "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
  "PLR2004", # Magic value used in comparison, ...
  "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
]


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
